name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Backend CI Job ---
  backend-ci:
    name: ☕ Backend Build & Test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.head_commit.message, '[skip ci]') == false
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'test_password' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Export JAVA_HOME
        run: echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Check Backend Changes
        id: check_files
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pom.xml'
              - '.github/workflows/**'

      - name: Make mvnw executable
        if: steps.check_files.outputs.backend == 'true'
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Build and Test Backend
        if: steps.check_files.outputs.backend == 'true'
        working-directory: ./backend
        run: ./mvnw clean install -DskipTests=false
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecommerce
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'test_password' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'test_jwt_key_for_ci_testing_only_min_256_bits_required' }}

      # --- FIXED: OWASP Dependency Check (using exact official casing) ---
      - name: OWASP Dependency Check
        if: steps.check_files.outputs.backend == 'true'
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'ecommerce-backend'
          path: './backend'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --enableRetired
            --disableAssembly

      - name: Upload Security Report
        if: always() && steps.check_files.outputs.backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

  # --- Frontend CI Job ---
  frontend-ci:
    name: ⚛️ Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Frontend Changes
        id: check_files
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

      - name: Set up Node.js
        if: steps.check_files.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        if: steps.check_files.outputs.frontend == 'true'
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Security Audit
        if: steps.check_files.outputs.frontend == 'true'
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Lint Frontend
        if: steps.check_files.outputs.frontend == 'true'
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Build Frontend
        if: steps.check_files.outputs.frontend == 'true'
        working-directory: ./frontend
        run: npm run build

  # --- Docker Build Job ---
  docker-build:
    name: 🐳 Docker Release & Scan
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # Required for uploading Trivy results
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build images first (load into Docker local daemon for scanning)
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: ecommerce-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: ecommerce-frontend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- NEW: Trivy Security Scanning ---
      - name: Run Trivy Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ecommerce-backend:scan'
          format: 'table'
          exit-code: '0' # Don't fail the build for now, just report
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ecommerce-frontend:scan'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Finally Push the images
      - name: Push Images to GHCR
        run: |
          docker tag ecommerce-backend:scan ghcr.io/${{ github.repository_owner }}/ecommerce-backend:latest
          docker tag ecommerce-backend:scan ghcr.io/${{ github.repository_owner }}/ecommerce-backend:${{ github.sha }}
          docker tag ecommerce-frontend:scan ghcr.io/${{ github.repository_owner }}/ecommerce-frontend:latest
          docker tag ecommerce-frontend:scan ghcr.io/${{ github.repository_owner }}/ecommerce-frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/ecommerce-backend:latest
          docker push ghcr.io/${{ github.repository_owner }}/ecommerce-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/ecommerce-frontend:latest
          docker push ghcr.io/${{ github.repository_owner }}/ecommerce-frontend:${{ github.sha }}
