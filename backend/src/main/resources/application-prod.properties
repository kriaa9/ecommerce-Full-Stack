# =====================================
# Production Profile Configuration
# =====================================
# This profile is activated when SPRING_PROFILES_ACTIVE=prod

# Override defaults for production environment
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Strict security - require all secrets to be set
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
application.security.jwt.secret-key=${JWT_SECRET_KEY}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Health endpoint requires authentication in production
management.endpoint.health.show-details=when-authorized
management.endpoints.web.exposure.include=health
