spring.application.name=ecommerce-backend

# =====================================
# Database Configuration (Supabase PostgreSQL)
# =====================================
# Default: Supabase cloud database
# Override with environment variables if needed
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.dlqmmnnfrtrwlmbukzyg.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:E-commerce123@}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================================
# JWT Configuration
# =====================================
application.security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# =====================================
# Cloudinary Configuration
# =====================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dzv7sdd90}
cloudinary.api-key=${CLOUDINARY_API_KEY:525869592329297}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:U2FVEfEjvhcRJzZrAUOdTX3KABw}

# =====================================
# File Upload Configuration
# =====================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# =====================================
# JSON Configuration
# =====================================
spring.jackson.serialization.write-dates-as-timestamps=false

# =====================================
# CORS Configuration
# =====================================
# Comma-separated list of allowed origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# =====================================
# Monitoring & Actuator
# =====================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
