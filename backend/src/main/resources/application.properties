spring.application.name=ecommerce-backend

# =====================================
# Database Configuration (Supabase PostgreSQL)
# =====================================
# Using Supabase Transaction Pooler (IPv4 compatible)
# prepareThreshold=0 disables prepared statements (required for PgBouncer/Transaction Pooler)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-eu-west-3.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.dlqmmnnfrtrwlmbukzyg}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:E-commerce123@}

# HikariCP Connection Pool Configuration (optimized for PgBouncer/Supabase)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=true
# Disable prepared statement caching (required for PgBouncer transaction mode)
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=0
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=0

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# =====================================
# JWT Configuration
# =====================================
application.security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# =====================================
# Cloudinary Configuration
# =====================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dzv7sdd90}
cloudinary.api-key=${CLOUDINARY_API_KEY:525869592329297}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:U2FVEfEjvhcRJzZrAUOdTX3KABw}

# =====================================
# File Upload Configuration
# =====================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# =====================================
# JSON Configuration
# =====================================
spring.jackson.serialization.write-dates-as-timestamps=false

# =====================================
# CORS Configuration
# =====================================
# Comma-separated list of allowed origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# =====================================
# Monitoring & Actuator
# =====================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
